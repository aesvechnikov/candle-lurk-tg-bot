name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist
          export CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOFLAGS=-buildvcs=false
          go build -o dist/tg-lurk-ai-bot         ./cmd/bot
          go build -o dist/tg-lurk-ai-bot-backend ./cmd/backend
          go build -o dist/tg-lurk-ai-bot-mcp     ./cmd/mcp

      - name: Build STT (Vosk, cgo)
        run: |
          wget -q https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-linux-x86_64-0.3.45.zip
          unzip -o -q vosk-linux-x86_64-0.3.45.zip
          VOSK_DIR="$(pwd)/vosk-linux-x86_64-0.3.45"
          CGO_ENABLED=1 CGO_CFLAGS="-I${VOSK_DIR}" CGO_LDFLAGS="-L${VOSK_DIR} -lvosk -ldl -lpthread" \
            go build -tags vosk -o dist/tg-lurk-ai-bot-stt ./cmd/stt
          cp "${VOSK_DIR}/libvosk.so" dist/libvosk.so

      - name: Copy files to server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key \
            dist/tg-lurk-ai-bot dist/tg-lurk-ai-bot-backend dist/tg-lurk-ai-bot-mcp dist/tg-lurk-ai-bot-stt dist/libvosk.so opencode.json AGENTS.md deploy/deploy-tg.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/deploy/"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key -r \
            .opencode \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/deploy/"

      - name: Install and restart services
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo /usr/local/bin/deploy-tg /tmp/deploy"
